[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econom"
version = "0.1.0"
description = "ECON — Execution & Cognitive Optimization Network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.5",
    "pydantic>=2.10",
    "httpx>=0.28",
    "gunicorn>=23",
    "uvicorn>=0.34",
    "python-dotenv>=1.1",
    "django-cors-headers>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.12",
    "mypy>=1.16",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
    "types-redis>=4.6",
]

[project.scripts]
econom = "econom.cli:main"
econom-host-agent = "host_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["config*", "apps*", "core*", "econom*", "host_agent*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "apps", "core", "econom", "host_agent"]
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = false
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
